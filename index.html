<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Royale Cruise Finder</title>
<meta name="theme-color" content="#0c2d57">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf5e8; --card:#fffdf7; --ink:#10243d; --muted:#4d5f77; --line:#e6dcc3;
  --brand:#0c2d57; --accent:#e2483d; --accent-dk:#a92c23; --accent-ink:#fff;
  --gold:#f2b632; --gold-ink:#6b4a00; --gold-soft:#fff3cf; --sea:#1c7fa3; --sea-soft:#e2f2f8;
  --chip:#f4ecd7; --chip-line:#d9cfb4; --chip-on:#0c2d57; --chip-on-ink:#ffd978;
  --good:#0b6b46; --good-soft:#d9f1e4; --date-bg:#ffe9a8; --date-ink:#0c2d57; --link:#b3261e;
  --shadow:0 2px 0 var(--line);
  --serif:Fraunces,"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#08172b; --card:#0f2440; --ink:#f3ead6; --muted:#a9b8cc; --line:#223a5c;
  --brand:#061225; --accent:#ef5b4f; --accent-dk:#9c2a22; --accent-ink:#fff;
  --gold:#f2b632; --gold-ink:#ffd978; --gold-soft:#2b2a22; --sea:#5cc0e0; --sea-soft:#12354f;
  --chip:#173153; --chip-line:#2b4770; --chip-on:#f2b632; --chip-on-ink:#0c2d57;
  --good:#6fd8a2; --good-soft:#12382b; --date-bg:#3a3317; --date-ink:#ffd978; --link:#ff9a90;
  --shadow:0 2px 0 #050e1c;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,"Avenir Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 16px 0;padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;max-width:1200px;margin:0 auto}
.logo{flex:none}
h1{font:700 22px/1.1 var(--serif);margin:0}
h1 small{display:block;font:700 12.5px/1.3 Nunito,system-ui,sans-serif;color:#ffd978;margin-top:3px}
.search{order:3;flex:1 1 100%}
#openFilters{margin-left:auto}
@media (min-width:600px){.search{order:0;flex:1 1 0;max-width:460px;margin-left:auto}#openFilters{margin-left:0}}
.search input{width:100%;border:0;border-radius:999px;padding:11px 18px;background:#fffdf7;color:#10243d;font-size:16px;min-height:44px}
.search input::placeholder{color:#5d6b7c}
#openFilters{border:0;border-radius:999px;background:var(--gold);color:#0c2d57;padding:10px 18px;min-height:44px;font-weight:800;white-space:nowrap}
#openFilters .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:#0c2d57;color:#ffd978;font-size:12px;line-height:20px;text-align:center}
#openFilters .badge:empty{display:none}
.waves{display:block;width:100%;height:20px;margin-top:10px;color:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:4px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.count{font:700 19px var(--serif)}
.bar select{border:1px solid var(--chip-line);background:var(--card);border-radius:999px;padding:8px 12px;min-height:40px;font-weight:700}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.active:empty{display:none}
.pill{border:1px solid var(--chip-line);border-radius:999px;background:var(--chip);padding:6px 12px;font-size:13px;font-weight:700;min-height:36px}
.pill::after{content:" ×";opacity:.6}
.pill.clear{background:none;border-color:transparent;color:var(--link);font-weight:800}
.pill.clear::after{content:""}

/* filter panel */
#panel{display:none}
#panel.open{display:flex;position:fixed;inset:0;z-index:40;background:var(--bg);flex-direction:column}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:2px dashed var(--line);background:var(--card)}
.phead h2{margin:0;font:700 20px var(--serif)}
.phead button{border:0;background:none;color:var(--link);font-weight:800;padding:8px;min-height:44px}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 16px}
.pfoot{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:2px dashed var(--line);background:var(--card)}
.pfoot button{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:14px;font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--accent-dk);min-height:48px}
fieldset{border:0;border-bottom:1px solid var(--line);margin:0;padding:16px 0;min-width:0}
legend{float:left;width:100%;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;padding:0}
legend button{border:0;background:none;color:var(--link);font-size:13px;font-weight:800;padding:4px 0;cursor:pointer}
legend button[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;clear:both}
.chip{border:1px solid var(--chip-line);background:var(--chip);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px;font-weight:700;user-select:none;-webkit-tap-highlight-color:transparent}
.chip small{color:var(--muted);margin-left:4px;font-weight:600}
.chip[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.chip[aria-pressed=true] small{color:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#06202e}.chip[aria-pressed=true] small{color:rgba(6,32,46,.75)}}
fieldset[data-g=tiers] .chip{border:2px dashed #c9a24a;background:var(--gold-soft);color:var(--gold-ink)}
fieldset[data-g=tiers] .chip small{color:var(--gold-ink);opacity:.75}
fieldset[data-g=tiers] .chip[aria-pressed=true]{background:var(--chip-on);border-color:var(--gold);color:var(--chip-on-ink)}
fieldset[data-g=tiers] .chip[aria-pressed=true] small{color:var(--chip-on-ink)}
.rgrp{clear:both;padding:6px 0 8px}
.rgrp+.rgrp{border-top:1px dashed var(--line)}
.rgrp .chip.reg{font-weight:800}
.rgrp .sub{margin-top:8px;padding-left:12px}
.rgrp .sub .chip{font-size:13px;padding:6px 12px;min-height:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;clear:both}
.two label{font-size:13px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.two input,.two select{border:1px solid var(--chip-line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:16px;width:100%;min-height:44px}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0;clear:both}

/* results */
#list{display:grid;gap:14px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.ctop{padding:16px 18px 14px;border-bottom:2px dashed var(--line)}
.l1{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 10px;align-items:flex-start}
.ship{font:700 21px/1.2 var(--serif)}
.cls{font-size:12px;color:var(--sea);background:var(--sea-soft);border-radius:999px;padding:2px 10px;margin-left:8px;font-weight:800;white-space:nowrap;vertical-align:2px}
.date{white-space:nowrap;font-weight:800;font-size:14px;color:var(--date-ink);background:var(--date-bg);border-radius:10px;padding:6px 11px}
.itin{margin-top:4px;font-weight:600}
.port{font-size:14px;color:var(--muted);margin-top:2px}
.ow{color:var(--link);font-weight:800}
.offers{padding:2px 18px 6px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;padding:10px 0;align-items:center}
.offer+.offer{border-top:1px dashed var(--line)}
.pts{width:58px;height:58px;border-radius:50%;background:var(--gold);color:#0c2d57;border:3px dashed var(--card);outline:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;margin:3px}
.pts small{font-size:9.5px;font-weight:800;margin-top:3px;opacity:.85}
.room{font-weight:800}
.perks{font-size:14px;color:var(--muted)}
.fp{color:var(--good);background:var(--good-soft);font-weight:800;padding:1px 8px;border-radius:6px}
.guests{font-size:13px;white-space:nowrap;color:var(--muted);text-align:right;font-weight:700}
.more{display:block;margin:18px auto;border:2px solid var(--brand);background:var(--card);color:var(--brand);border-radius:999px;padding:11px 22px;min-height:46px;font-weight:800}
@media (prefers-color-scheme:dark){.more{border-color:var(--gold);color:var(--gold)}}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);margin-top:26px;line-height:1.55}
footer table{border-collapse:collapse;margin-top:6px}
footer td{padding:1px 12px 1px 0}
@media (max-width:480px){
  h1{font-size:18px}
  .hrow{gap:10px}
  .offer{grid-template-columns:auto 1fr}
  .guests{grid-column:2;text-align:left}
}
@media (min-width:900px){
  #openFilters{display:none}
  .wrap{grid-template-columns:300px minmax(0,1fr);align-items:start;gap:24px}
  /* Sidebar flows with the page (no inner scroll box) so every filter is reachable by scrolling the page. */
  #panel,#panel.open{display:flex;position:static;inset:auto;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);z-index:1}
  .pbody{overflow:visible;flex:none}
  .phead{border-radius:20px 20px 0 0;padding-top:14px}
  #closeFilters,.pfoot{display:none}
}

/* tier analysis */
.linkbtn{border:0;background:none;padding:0;font:inherit;color:#fff;text-decoration:underline;text-underline-offset:3px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,12,24,.55);display:flex;align-items:stretch;justify-content:center}
.modal[hidden]{display:none}
.mbox{background:var(--bg);width:100%;display:flex;flex-direction:column;max-height:100%}
.mbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 28px;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.mbody h3{font:700 19px var(--serif);margin:22px 0 8px}
.mbody p{margin:8px 0}
.mbody .lead{font-size:16.5px}
.tt{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tt th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:6px 6px;border-bottom:2px solid var(--line)}
.tt td{padding:9px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.tt tbody tr{cursor:pointer}
.tt tbody tr:hover td{background:var(--chip)}
.tt .pt{font-weight:800;white-space:nowrap}
.tt .pt small{display:block;color:var(--muted);font-weight:700;font-size:11.5px}
.tt .num{font-weight:800;font-variant-numeric:tabular-nums}
.tt .num.dip{color:var(--link)}
.bar8{height:8px;border-radius:4px;background:var(--sea);margin-top:5px;min-width:4px}
.tt .rm{font-weight:700}
.tt .sub2{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.dip-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.dip-card b.h{font:700 17px var(--serif);display:block;margin-bottom:4px}
.dip-card ul{margin:6px 0 0;padding-left:20px}
.dip-card li{margin:3px 0}
.note{font-size:13px;color:var(--muted)}
@media (min-width:700px){
  .modal{align-items:center;padding:24px}
  .mbox{max-width:780px;max-height:92vh;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <svg class="logo" width="42" height="42" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#f2b632"/><circle cx="22" cy="22" r="16" fill="none" stroke="#0c2d57" stroke-width="2" stroke-dasharray="5 4"/><path d="M22 11v17M15 22a7 7 0 0 0 14 0M18 14h8" stroke="#0c2d57" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <h1>Club Royale Cruise Finder<small><span id="sub">Free cruise offers</span> · <button type="button" class="linkbtn" id="openAnalysis">Tier analysis</button></small></h1>
    <div class="search"><input id="q" type="search" placeholder="Search: Alaska, Perfect Day…" enterkeyhint="search" autocomplete="off"></div>
    <button id="openFilters" type="button">Filters<span class="badge" id="badge"></span></button>
  </div>
  <svg class="waves" viewBox="0 0 1200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20V10C50 10 50 1 100 1S150 10 200 10 250 1 300 1 350 10 400 10 450 1 500 1 550 10 600 10 650 1 700 1 750 10 800 10 850 1 900 1 950 10 1000 10 1050 1 1100 1 1150 10 1200 10V20Z" fill="currentColor"/></svg>
</header>

<div class="wrap">
  <aside id="panel" aria-label="Filters">
    <div class="phead"><h2>Filters</h2><div><button type="button" id="resetAll">Reset</button> <button type="button" id="closeFilters">Done</button></div></div>
    <div class="pbody" id="pbody"></div>
    <div class="pfoot"><button type="button" id="showBtn">Show cruises</button></div>
  </aside>

  <main>
    <div class="bar">
      <span class="count" id="count">Loading…</span>
      <label>Sort by <select id="sort">
        <option value="date">Sail date</option>
        <option value="short">Shortest first</option>
        <option value="long">Longest first</option>
        <option value="pts">Fewest points</option>
        <option value="fp">Most FreePlay</option>
      </select></label>
    </div>
    <div class="active" id="active"></div>
    <div id="list"></div>
    <button class="more" id="more" hidden>Show more</button>
    <footer id="foot"></footer>
  </main>
</div>

<div class="modal" id="analysis" hidden role="dialog" aria-modal="true" aria-labelledby="anTitle">
  <div class="mbox">
    <div class="phead"><h2 id="anTitle">Tier analysis</h2><button type="button" id="closeAnalysis">Close</button></div>
    <div class="mbody" id="anBody"></div>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const PAGE = 40;
const CATS = ["Interior", "Ocean View", "Balcony", "Suite"];
let D, shown = PAGE, results = [];
const st = { tiers:new Set(), cls:new Set(), ships:new Set(), ports:new Set(), regions:new Set(), route:new Set(), cats:new Set(), guests:new Set(),
             from:"", to:"", nmin:"", nmax:"", q:"", sort:"date" };

const region = p => p.split(", ").pop();
const short = n => n.replace(/ Of The Seas$/, "");
const fmt = n => n.toLocaleString("en-US");
const kpts = p => p >= 1000 ? (p % 1000 ? (p/1000).toFixed(1) : p/1000) + "K" : String(p);
const tierLabel = o => o.code.replace(/^\d{4}C/, "");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dateLabel = iso => { const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", year:"numeric"}); };

fetch("cruises.json", {cache:"no-cache"}).then(r => { if (!r.ok) throw r.status; return r.json(); })
  .then(init).catch(e => { $("#count").textContent = "Couldn't load cruises.json (" + e + ")"; });

function init(data) {
  D = data;
  D.sailings.forEach(s => {
    s.ship = D.ships[s.s]; s.port = D.ports[s.p];
    s.ow = "e" in s; s.end = s.e >= 0 ? D.ports[s.e] : "";
    s.hay = (s.ship.name + " " + s.ship.cls + " " + s.port + " " + s.end + " " + s.i + (s.ow ? " one-way repositioning" : "")).toLowerCase();
  });
  D.roomCat = D.rooms.map(r => r.cat);
  D.portRegion = D.ports.map(region);
  const maxN = Math.max(...D.sailings.map(s => s.n));
  D.nights = [...new Set(D.sailings.map(s => s.n))].sort((a,b) => a-b);
  $("#sub").textContent = "Offer " + D.source.replace(".pdf","") + " · " + D.sailings.length.toLocaleString() + " sailings";
  readURL();
  buildPanel();
  bind();
  footer();
  $("#openAnalysis").onclick = openAnalysis;
  $("#closeAnalysis").onclick = closeAnalysis;
  $("#analysis").addEventListener("click", e => {
    if (e.target.id === "analysis") return closeAnalysis();
    const tr = e.target.closest("tr[data-tier]"); if (!tr) return;
    ["tiers","cls","ships","ports","regions","route","cats","guests"].forEach(k => st[k].clear());
    st.tiers.add(Number(tr.dataset.tier)); closeAnalysis(); changed(true); window.scrollTo(0, 0);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#analysis").hidden) closeAnalysis(); });
  run();
}

/* ---------- panel ---------- */
function count(fn) { const c = new Map(); D.sailings.forEach(s => fn(s).forEach(k => c.set(k, (c.get(k)||0)+1))); return c; }

function chipGroup(id, title, items, set, hint) {
  // items: [{v, label, n}]
  return `<fieldset data-g="${id}"><legend>${title}<button type="button" data-clear="${id}" ${set.size?"":"hidden"}>Clear</button></legend>
    <div class="chips">${items.map(it => `<button type="button" class="chip" data-g="${id}" data-v="${esc(String(it.v))}" aria-pressed="${set.has(it.v)}">${esc(it.label)}${it.n!=null?`<small>${fmt(it.n)}</small>`:""}</button>`).join("")}</div>
    ${hint?`<p class="hint">${hint}</p>`:""}</fieldset>`;
}

function portGroup(ports, portN) {
  // Group ports by state/country (last comma part); regions ordered by sailing count.
  const regs = new Map();
  ports.forEach(x => { const r = D.portRegion[x.i]; if (!regs.has(r)) regs.set(r, {r, ports:[], n:0}); const g = regs.get(r); g.ports.push(x); g.n += portN.get(x.i) || 0; });
  const all = [...regs.values()].sort((a,b) => b.n - a.n);
  const multi = all.filter(g => g.ports.length > 1), single = all.filter(g => g.ports.length === 1);
  const chip = (g, v, label, n, cls="") => `<button type="button" class="chip ${cls}" data-g="${g}" data-v="${esc(String(v))}" aria-pressed="false">${esc(label)}<small>${fmt(n)}</small></button>`;
  return `<fieldset><legend>Departure port<button type="button" data-clear="ports" hidden>Clear</button></legend>
    ${multi.map(g => `<div class="rgrp"><div class="chips">${chip("regions", g.r, "All " + g.r, g.n, "reg")}</div>
      <div class="chips sub">${g.ports.sort((a,b) => a.p.localeCompare(b.p)).map(x => chip("ports", x.i, x.p.split(", ")[0], portN.get(x.i))).join("")}</div></div>`).join("")}
    <div class="rgrp"><div class="chips">${single.map(g => chip("regions", g.r, g.ports[0].p, g.n)).join("")}</div></div>
    <p class="hint">Tap a state or country for any port there, or pick individual ports.</p></fieldset>`;
}

function buildPanel() {
  const tierN = count(s => [...new Set(s.o.map(o => o[0]))]);
  const clsN = count(s => [s.ship.cls]), shipN = count(s => [s.s]), portN = count(s => [s.p]);
  const catN = count(s => [...new Set(s.o.map(o => D.roomCat[o[1]]))]);
  const classes = ["Icon","Oasis","Quantum","Freedom","Voyager","Radiance","Vision"].filter(c => clsN.has(c));
  const ships = D.ships.map((sh, i) => ({sh, i})).filter(x => !st.cls.size || st.cls.has(x.sh.cls))
    .sort((a,b) => classes.indexOf(a.sh.cls) - classes.indexOf(b.sh.cls) || a.sh.name.localeCompare(b.sh.name));
  const ports = D.ports.map((p, i) => ({p, i}));
  const nOpts = (sel) => `<option value="">Any</option>` + D.nights.map(n => `<option ${String(n)===sel?"selected":""}>${n}</option>`).join("");

  $("#pbody").innerHTML =
    chipGroup("tiers", "Points tier", [...D.offers.keys()].reverse().map(i => ({v:i, label:kpts(D.offers[i].points)+" · "+tierLabel(D.offers[i]), n:tierN.get(i)||0})), st.tiers,
      "Each tier is a separate offer code. Pick yours (or several to compare).") +
    `<fieldset><legend>Sail dates</legend><div class="two">
      <label>From<input type="date" id="from" value="${st.from}"></label>
      <label>To<input type="date" id="to" value="${st.to}"></label></div></fieldset>` +
    `<fieldset><legend>Nights</legend><div class="two">
      <label>Min<select id="nmin">${nOpts(st.nmin)}</select></label>
      <label>Max<select id="nmax">${nOpts(st.nmax)}</select></label></div></fieldset>` +
    chipGroup("cls", "Ship class", classes.map(c => ({v:c, label:c, n:clsN.get(c)})), st.cls) +
    chipGroup("ships", "Ship", ships.map(x => ({v:x.i, label:short(x.sh.name), n:shipN.get(x.i)})), st.ships,
      st.cls.size ? "Showing ships in the selected class(es)." : "") +
    portGroup(ports, portN) +
    chipGroup("route", "Route", [{v:"rt", label:"Round trip", n:D.sailings.filter(x => !x.ow).length}, {v:"ow", label:"One-way / repositioning", n:D.sailings.filter(x => x.ow).length}], st.route,
      "One-way = ends at a different port than it starts. Inferred from the ship\u2019s next sailing and itinerary names, since the PDFs only list departure ports.") +
    chipGroup("cats", "Stateroom", CATS.filter(c => catN.has(c)).map(c => ({v:c, label:c, n:catN.get(c)})), st.cats,
      "GTY = guaranteed: Royal picks the room within that category.") +
    chipGroup("guests", "Offer", [{v:2, label:"Free fare for 2"}, {v:1, label:"Free fare for 1"}], st.guests,
      "“For 1”: guest 2 pays a reduced fare; taxes & fees apply to all.");
  syncPanel();
}

function bind() {
  $("#pbody").addEventListener("click", e => {
    const c = e.target.closest(".chip"), clr = e.target.closest("[data-clear]");
    if (c) {
      const g = c.dataset.g, raw = c.dataset.v, v = ["tiers","ships","ports","guests"].includes(g) ? Number(raw) : raw;
      if (g === "regions") {
        // Selecting a whole region supersedes its individual ports.
        D.ports.forEach((_, i) => { if (D.portRegion[i] === v) st.ports.delete(i); });
        st.regions.has(v) ? st.regions.delete(v) : st.regions.add(v);
      } else if (g === "ports" && st.regions.has(D.portRegion[v])) {
        // Tapping one port of a selected region = "that region except this port".
        const r = D.portRegion[v]; st.regions.delete(r);
        D.ports.forEach((_, i) => { if (D.portRegion[i] === r && i !== v) st.ports.add(i); });
      } else st[g].has(v) ? st[g].delete(v) : st[g].add(v);
      if (g === "cls") pruneShips();
      changed(g === "cls");
    } else if (clr) { st[clr.dataset.clear].clear(); if (clr.dataset.clear === "ports") st.regions.clear(); if (clr.dataset.clear === "cls") pruneShips(); changed(true); }
  });
  $("#pbody").addEventListener("change", e => {
    if (["from","to","nmin","nmax"].includes(e.target.id)) { st[e.target.id] = e.target.value; changed(); }
  });
  let t; $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value.trim(); changed(); }, 150); });
  $("#q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("#sort").addEventListener("change", e => { st.sort = e.target.value; changed(); });
  $("#openFilters").onclick = () => { $("#panel").classList.add("open"); document.body.style.overflow = "hidden"; };
  const close = () => { $("#panel").classList.remove("open"); document.body.style.overflow = ""; window.scrollTo(0,0); };
  $("#closeFilters").onclick = close; $("#showBtn").onclick = close;
  $("#resetAll").onclick = () => { reset(); changed(true); };
  $("#more").onclick = () => { shown += PAGE; render(); };
  $("#active").addEventListener("click", e => {
    const b = e.target.closest(".pill"); if (!b) return;
    if (b.dataset.k === "all") reset();
    else { const [g, v] = b.dataset.k.split(":"); if (st[g] instanceof Set) st[g].delete(["cls","cats","regions","route"].includes(g) ? v : Number(v)); else st[g] = ""; if (g==="q") $("#q").value=""; if (g==="cls") pruneShips(); }
    changed(true);
  });
  if ("IntersectionObserver" in window) new IntersectionObserver(es => { if (es[0].isIntersecting && !$("#more").hidden) { shown += PAGE; render(); } }, {rootMargin:"600px"}).observe($("#more"));
  window.addEventListener("popstate", () => { readURL(); buildPanel(); run(false); });
}

function pruneShips() { if (st.cls.size) [...st.ships].forEach(i => { if (!st.cls.has(D.ships[i].cls)) st.ships.delete(i); }); }
function reset() { ["tiers","cls","ships","ports","regions","route","cats","guests"].forEach(k => st[k].clear()); st.from = todayISO(); st.to = st.nmin = st.nmax = st.q = ""; $("#q").value = ""; }

function changed(rebuild) {
  shown = PAGE;
  if (rebuild) buildPanel(); else syncPanel();
  run();
}
function syncPanel() {
  document.querySelectorAll("#pbody .chip").forEach(c => {
    const g = c.dataset.g, v = ["tiers","ships","ports","guests"].includes(g) ? Number(c.dataset.v) : c.dataset.v;
    c.setAttribute("aria-pressed", st[g].has(v) || (g === "ports" && st.regions.has(D.portRegion[v])));
  });
  document.querySelectorAll("#pbody [data-clear]").forEach(b => b.hidden = !(st[b.dataset.clear].size || (b.dataset.clear === "ports" && st.regions.size)));
}

/* ---------- filtering ---------- */
function run(push = true) {
  const q = st.q.toLowerCase().split(/\s+/).filter(Boolean);
  const nmin = st.nmin ? +st.nmin : 0, nmax = st.nmax ? +st.nmax : 1e9;
  results = [];
  for (const s of D.sailings) {
    if (st.from && s.d < st.from) continue;
    if (st.to && s.d > st.to) continue;
    if (s.n < nmin || s.n > nmax) continue;
    if (st.cls.size && !st.cls.has(s.ship.cls)) continue;
    if (st.ships.size && !st.ships.has(s.s)) continue;
    if ((st.ports.size || st.regions.size) && !st.ports.has(s.p) && !st.regions.has(D.portRegion[s.p])) continue;
    if (st.route.size && !st.route.has(s.ow ? "ow" : "rt")) continue;
    if (q.length && !q.every(w => s.hay.includes(w))) continue;
    const offers = s.o.filter(o => (!st.tiers.size || st.tiers.has(o[0])) && (!st.cats.size || st.cats.has(D.roomCat[o[1]])) && (!st.guests.size || st.guests.has(o[2])));
    if (offers.length) results.push({s, offers});
  }
  const minPts = r => Math.min(...r.offers.map(o => D.offers[o[0]].points));
  const maxFp = r => Math.max(...r.offers.map(o => o[3]));
  const byDate = (a,b) => a.s.d.localeCompare(b.s.d);
  const sorts = { date: byDate, short: (a,b) => a.s.n-b.s.n || byDate(a,b), long: (a,b) => b.s.n-a.s.n || byDate(a,b),
                  pts: (a,b) => minPts(a)-minPts(b) || byDate(a,b), fp: (a,b) => maxFp(b)-maxFp(a) || byDate(a,b) };
  results.sort(sorts[st.sort] || byDate);
  $("#sort").value = st.sort;
  render();
  activePills();
  if (push) writeURL();
}

function render() {
  const n = results.length, offN = results.reduce((a,r) => a + r.offers.length, 0);
  $("#count").textContent = `${fmt(n)} sailing${n===1?"":"s"}` + (n ? ` · ${fmt(offN)} offer${offN===1?"":"s"}` : "");
  $("#showBtn").textContent = n ? `Show ${fmt(n)} sailing${n===1?"":"s"}` : "No matches";
  $("#list").innerHTML = n ? results.slice(0, shown).map(card).join("") : `<div class="empty">No sailings match those filters.</div>`;
  $("#more").hidden = shown >= n;
  $("#more").textContent = `Show more (${fmt(n - Math.min(shown, n))} left)`;
}

function card({s, offers}) {
  return `<article class="card"><div class="ctop">
    <div class="l1"><div><span class="ship">${esc(short(s.ship.name))}</span><span class="cls">${s.ship.cls} class</span></div><span class="date">${dateLabel(s.d)}</span></div>
    <div class="itin">${esc(s.i)}</div>
    <div class="port">${s.n} nights from ${esc(s.port)}${s.ow ? ` <span class="ow">→ ${s.end ? esc(s.end) : "one-way"}</span>` : ""}</div></div>
    <div class="offers">${offers.map(o => { const t = D.offers[o[0]], r = D.rooms[o[1]];
      return `<div class="offer"><div class="pts">${fmt(t.points)}<small>${tierLabel(t)} pts</small></div>
        <div><div class="room">${esc(r.name)}</div><div class="perks">${o[3] ? `<span class="fp">$${fmt(o[3])} FreePlay</span> · ` : ""}$${o[4]} OBC</div></div>
        <div class="guests">Fare for ${o[2]}</div></div>`; }).join("")}</div></article>`;
}

function activePills() {
  const p = [];
  const add = (k, label) => p.push(`<button type="button" class="pill" data-k="${esc(k)}">${esc(label)}</button>`);
  if (st.q) add("q:", `“${st.q}”`);
  st.tiers.forEach(i => add("tiers:"+i, fmt(D.offers[i].points)+" pts"));
  if (st.from) add("from:", "From " + st.from);
  if (st.to) add("to:", "To " + st.to);
  if (st.nmin) add("nmin:", "≥ " + st.nmin + " nights");
  if (st.nmax) add("nmax:", "≤ " + st.nmax + " nights");
  st.cls.forEach(c => add("cls:"+c, c + " class"));
  st.ships.forEach(i => add("ships:"+i, short(D.ships[i].name)));
  st.regions.forEach(r => add("regions:"+r, D.portRegion.filter(x => x === r).length > 1 ? r + " (any port)" : r));
  st.ports.forEach(i => add("ports:"+i, D.ports[i].split(",")[0]));
  st.route.forEach(r => add("route:"+r, r === "ow" ? "One-way" : "Round trip"));
  st.cats.forEach(c => add("cats:"+c, c));
  st.guests.forEach(g => add("guests:"+g, "Fare for " + g));
  const nf = p.length - (st.q ? 1 : 0) - (st.from === todayISO() ? 1 : 0);
  $("#badge").textContent = nf || "";
  if (p.length > 1) p.push(`<button type="button" class="pill clear" data-k="all">Clear all</button>`);
  $("#active").innerHTML = p.join("");
}

/* ---------- URL state (shareable links) ---------- */
function writeURL() {
  const u = new URLSearchParams();
  const put = (k, v) => { if (v) u.set(k, v); };
  put("tier", [...st.tiers].map(i => tierLabel(D.offers[i])).join(","));
  if (st.from !== todayISO()) u.set("from", st.from || "any");
  put("to", st.to); put("nmin", st.nmin); put("nmax", st.nmax);
  put("class", [...st.cls].join(","));
  put("ship", [...st.ships].map(i => short(D.ships[i].name)).join(","));
  put("region", [...st.regions].join(","));
  put("port", [...st.ports].map(i => D.ports[i]).join("|"));
  put("route", [...st.route].map(r => r === "ow" ? "oneway" : "roundtrip").join(","));
  put("room", [...st.cats].join(","));
  put("guests", [...st.guests].join(","));
  put("q", st.q);
  if (st.sort !== "date") u.set("sort", st.sort);
  const qs = u.toString().replace(/%2C/g, ",").replace(/%7C/g, "|");
  history.replaceState(null, "", qs ? "?" + qs : location.pathname);
}
function readURL() {
  const u = new URLSearchParams(location.search), list = (k, sep=",") => (u.get(k) || "").split(sep).filter(Boolean);
  reset();
  list("tier").forEach(t => { const i = D.offers.findIndex(o => tierLabel(o) === t); if (i >= 0) st.tiers.add(i); });
  const f = u.get("from"); st.from = f === "any" ? "" : (f || todayISO());
  st.to = u.get("to") || ""; st.nmin = u.get("nmin") || ""; st.nmax = u.get("nmax") || "";
  list("class").forEach(c => st.cls.add(c));
  list("ship").forEach(n => { const i = D.ships.findIndex(s => short(s.name) === n); if (i >= 0) st.ships.add(i); });
  list("region").forEach(r => { if (D.portRegion.includes(r)) st.regions.add(r); });
  list("port", "|").forEach(n => { const i = D.ports.indexOf(n); if (i >= 0) st.ports.add(i); });
  list("route").forEach(r => st.route.add(r === "oneway" ? "ow" : "rt"));
  list("room").forEach(c => st.cats.add(c));
  list("guests").forEach(g => st.guests.add(Number(g)));
  st.q = u.get("q") || ""; $("#q").value = st.q;
  st.sort = u.get("sort") || "date";
}

/* ---------- tier analysis (computed from the data, so it stays right month to month) ---------- */
let anBuilt = false;
function openAnalysis() {
  if (!anBuilt) { $("#anBody").innerHTML = analysisHTML(); anBuilt = true; }
  $("#analysis").hidden = false; document.body.style.overflow = "hidden"; $("#closeAnalysis").focus();
}
function closeAnalysis() { $("#analysis").hidden = true; document.body.style.overflow = ""; $("#openAnalysis").focus(); }

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monLabel = ym => MON[+ym.slice(5) - 1] + " " + ym.slice(0, 4);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const topRooms = (cnt, k = 2) => { const e = [...cnt].sort((a,b) => b[1]-a[1]); return e.slice(0, k).map(x => x[0]).join(", ") + (e.length > k ? ` +${e.length - k} more` : ""); };

function analysisHTML() {
  const S = D.sailings, order = D.offers.map((o, i) => i).sort((a,b) => D.offers[a].points - D.offers[b].points);
  const T = order.map(i => {
    const ids = new Set(), rooms = new Map(); let f2 = 0, fpMin = Infinity, fpMax = 0;
    S.forEach((s, si) => s.o.forEach(o => { if (o[0] !== i) return;
      ids.add(si); const r = D.rooms[o[1]].name; rooms.set(r, (rooms.get(r)||0) + 1);
      if (o[2] === 2) f2++; fpMin = Math.min(fpMin, o[3]); fpMax = Math.max(fpMax, o[3]); }));
    return { i, o: D.offers[i], ids, rooms, f2, fpMin, fpMax, roomOf: si => D.rooms[S[si].o.find(o => o[0] === i)[1]].name };
  });
  const max = Math.max(...T.map(t => t.ids.size));
  const lo = T[0], hi = T[T.length - 1];

  // Ship class: where each one is most available
  const classes = [...new Set(D.ships.map(s => s.cls))];
  const clsLine = c => { const by = T.map(t => ({t, n:[...t.ids].filter(si => S[si].ship.cls === c).length})).filter(x => x.n).sort((a,b) => b.n - a.n);
    return by.length ? `<li><b>${c}:</b> ${by.slice(0, 3).map(x => `${kpts(x.t.o.points)} (${x.n})`).join(" · ")}</li>` : ""; };

  let h = `<p class="lead">This page turns Club Royale offer <b>${esc(D.source.replace(".pdf",""))}</b> into something searchable. Club Royale is Royal Caribbean’s casino loyalty program: the more you play, the more points you earn, and each month’s offer is split into <b>${T.length} tiers</b>, from ${fmt(lo.o.points)} to ${fmt(hi.o.points)} points. Each tier is its own offer code with its own list of sailings.</p>
  <p>For every sailing, the tier sets the stateroom you get, whether the cruise fare is covered for <b>2 guests</b> (you pay just taxes &amp; fees) or <b>1 guest</b> (guest 2 pays a reduced fare), plus any casino FreePlay and onboard credit (OBC) on your next cruise.</p>
  <p>You’d expect higher tiers to unlock more sailings. Mostly they do — but not always. The table shows where the count drops.</p>

  <h3>The tiers at a glance</h3>
  <table class="tt"><thead><tr><th>Tier</th><th>Sailings</th><th>Room offered</th></tr></thead><tbody>
  ${T.map((t, k) => { const prev = T[k-1], dip = prev && t.ids.size < prev.ids.size;
    return `<tr data-tier="${t.i}" title="Show the ${fmt(t.o.points)}-point sailings">
      <td class="pt">${fmt(t.o.points)}<small>${tierLabel(t.o)}</small></td>
      <td style="width:34%"><span class="num${dip ? " dip" : ""}">${fmt(t.ids.size)}${dip ? " ▼" : ""}</span><div class="bar8" style="width:${(100 * t.ids.size / max).toFixed(1)}%"></div></td>
      <td><span class="rm">${esc(topRooms(t.rooms))}</span><span class="sub2">Fare for 2 on ${pct(t.f2, t.ids.size)}%${t.fpMax ? ` · $${fmt(t.fpMin)}${t.fpMin !== t.fpMax ? `–$${fmt(t.fpMax)}` : ""} FreePlay` : ""}</span></td></tr>`; }).join("")}
  </tbody></table>
  <p class="note">Tap a tier to see its sailings. GTY = guaranteed: Royal assigns the cabin within that category.</p>`;

  // Dips: tiers with fewer sailings than the tier below
  const dips = T.map((t, k) => ({t, p: T[k-1]})).filter(x => x.p && x.t.ids.size < x.p.ids.size);
  h += `<h3>Why some tiers have fewer sailings</h3>`;
  if (!dips.length) h += `<p>In this offer, every tier has at least as many sailings as the one below it.</p>`;
  else h += `<p>Each drop happens where the <b>room on offer gets better</b>. Royal is giving away a more valuable cabin at that tier, and it holds back the sailings where that cabin is hardest to come by — peak season, the newest and biggest ships, and sailings already close to full.</p>` + dips.map(dipHTML).join("");

  h += `<h3>Where each ship class shows up</h3><p>Tiers with the most sailings for each class:</p><ul>${classes.map(clsLine).join("")}</ul>
  <p class="note">These patterns are worked out from the offer PDFs. Royal Caribbean doesn’t publish why a sailing is or isn’t in a tier, so treat the explanations as educated guesses. Everything here is recalculated automatically whenever new offer PDFs are loaded.</p>`;
  return h;

  function dipHTML({t, p}) {
    const dropped = [...p.ids].filter(si => !t.ids.has(si)), kept = [...p.ids].filter(si => t.ids.has(si));
    const gained = [...t.ids].filter(si => !p.ids.has(si)).length;
    const nD = dropped.length, base = p.ids.size;
    const share = (ids, f, v) => ids.filter(si => f(S[si]) === v).length;
    // Attributes over-represented among dropped sailings vs. the lower tier as a whole
    // lift = this group's drop rate ÷ the overall drop rate between these two tiers
    const skew = (f, label, minLift = 1.6) => {
      const vals = new Map(); dropped.forEach(si => { const v = f(S[si]); vals.set(v, (vals.get(v)||0) + 1); });
      return [...vals].map(([v, n]) => { const tot = share([...p.ids], f, v); return {v, n, tot, lift: (n / tot) / (nD / base)}; })
        .filter(x => x.n >= Math.max(5, nD * 0.03) && x.lift >= minLift).sort((a,b) => b.n * b.lift - a.n * a.lift).map(x => ({...x, label: label(x.v)}));
    };
    const ofN = x => `${fmt(x.n)} of ${fmt(x.tot)}`;
    const items = [];
    // Season: months that are over-represented, shown as a range when contiguous
    const months = skew(s => s.d.slice(0, 7), monLabel, 1.25).sort((a,b) => a.v.localeCompare(b.v));
    if (months.length) {
      const n = months.reduce((a, x) => a + x.n, 0), idx = months.map(x => +x.v.slice(0,4) * 12 + +x.v.slice(5));
      const contiguous = idx.every((v, k) => !k || v - idx[k-1] === 1);
      const first = months[0].v, last = months.at(-1).v;
      const when = contiguous && months.length > 1
        ? (first.slice(0,4) === last.slice(0,4) ? `${MON[+first.slice(5)-1]}–${monLabel(last)}` : `${monLabel(first)}–${monLabel(last)}`)
        : months.map(x => x.label).join(", ");
      if (n >= nD * 0.25) items.push(`<b>${when}</b> sailings: ${fmt(n)} of the ${fmt(nD)}`);
    }
    const cls = skew(s => s.ship.cls, v => v + " class").slice(0, 2);
    cls.forEach(x => items.push(`<b>${x.label}</b> ships: ${ofN(x)} drop out`));
    const ships = skew(s => short(s.ship.name), v => v).filter(x => !cls.some(c => D.ships.find(sh => short(sh.name) === x.v).cls === c.v)).slice(0, 3);
    if (ships.length) items.push(`Ships: ${ships.map(x => `<b>${esc(x.v)}</b> (${ofN(x)})`).join(", ")}`);
    const regs = skew(s => D.portRegion[s.p], v => v).slice(0, 3);
    if (regs.length) items.push(`Departing from ${regs.map(x => `<b>${esc(x.v)}</b> (${ofN(x)})`).join(", ")}`);
    // Room mismatch: did the lower tier offer a specific room on exactly the sailings that vanish?
    const rD = new Map(); dropped.forEach(si => { const r = p.roomOf(si); rD.set(r, (rD.get(r)||0) + 1); });
    const [topR, topN] = [...rD].sort((a,b) => b[1]-a[1])[0] || [];
    const keptTop = kept.filter(si => p.roomOf(si) === topR).length;
    const roomNote = topN >= nD * 0.8 && keptTop < kept.length * 0.6
      ? `<p>${topN === nD ? "Every" : "Almost every"} sailing that drops out is one where the ${fmt(p.o.points)} tier was offering <b>${esc(topR)}</b> rather than ${esc(topRooms(new Map([...t.rooms]), 1))} — so these are the sailings where Royal won’t give the better room away.</p>` : "";
    const f2Note = pct(t.f2, t.ids.size) === 100 && pct(p.f2, base) < 100 ? `, and every offer now covers the fare for 2 guests (only ${pct(p.f2, base)}% did at ${kpts(p.o.points)})` : "";
    return `<div class="dip-card"><b class="h">${fmt(p.o.points)} → ${fmt(t.o.points)} points: ${fmt(base)} → ${fmt(t.ids.size)} sailings</b>
      <p>The room steps up from <b>${esc(topRooms(p.rooms))}</b> to <b>${esc(topRooms(t.rooms))}</b>${f2Note}. ${fmt(nD)} sailings offered at ${fmt(p.o.points)} aren’t offered at ${fmt(t.o.points)}${gained ? `, and ${fmt(gained)} new ones appear` : ", and none are added"}.</p>
      ${roomNote}${items.length ? `<p>Overall ${pct(nD, base)}% of sailings drop out here, but much more of these:</p><ul>${items.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}</div>`;
  }
}

function footer() {
  $("#foot").innerHTML = `Source: Club Royale offer ${esc(D.source)}, extracted ${D.generated}. Taxes, fees and port expenses are extra and confirmed at booking; availability isn't guaranteed — confirm with Club Royale before planning around a sailing.
    <table>${D.offers.map(o => `<tr><td>${o.code}</td><td>${fmt(o.points)} pts</td><td>${o.fees ? `taxes &amp; fees ${o.fees[0]}–${o.fees[1]}` : ""}</td></tr>`).join("")}</table>`;
}
})();
</script>
</body>
</html>
